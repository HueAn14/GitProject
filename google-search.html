<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form Tìm kiếm Google</title>
</head>
<body>
    <h2>Tìm kiếm với Google</h2>
    <form action="https://www.google.com.vn/search" method="GET">
        <input type="text" name="q" placeholder="Nhập từ khóa tìm kiếm trên Google..."/>
        <input type="submit" value="Tìm kiếm Google"/>
    </form>

    <hr/>

    <h2>Tìm kiếm với Bing</h2>
    <form action="https://www.bing.com/search" method="GET">
        <input type="text" name="q" placeholder="Nhập từ khóa tìm kiếm trên Bing..."/>
        <input type="submit" value="Tìm kiếm Bing"/>
    </form>
</body>
</html>
